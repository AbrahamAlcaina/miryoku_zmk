# Report two batteries
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BATTERY_REPORTING=y
# mouse yes
CONFIG_ZMK_MOUSE=y
# Max radio TX power (+8 dBm, nRF52840): fixes BLE supervision timeouts to the PC
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 1M PHY only (no 2M): more robust/longer range on the split link and with some host chips
CONFIG_BT_CTLR_PHY_2M=n
